{% extends "base.html" %}

{% block content %}

<div class="hero-glass text-center">

    <div class="terminal-tag mb-3">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
        <span class="terminal-path">root@cybershield:~$</span>
    </div>

    <h1 class="glitch-title" data-text="CyberShield">CyberShield</h1>

    <p class="tagline">
        <span class="typed-text">Automated Vulnerability Scanner</span><span class="cursor">_</span>
    </p>

    <div class="mt-4">
        {% if user.is_authenticated %}

        <a class="btn btn-success btn-lg glow-btn" href="/dashboard/">
            [ Go to Dashboard ]
        </a>

        {% else %}

        <a class="btn btn-primary btn-lg glow-btn" href="/login/">
            [ Login ]
        </a>

        {% endif %}
    </div>

    <div class="status-row mt-5">
        <span class="status-chip"><span class="pulse-dot"></span> System Online</span>
        <span class="status-chip">Threat DB: Updated</span>
        <span class="status-chip">Encryption: AES-256</span>
    </div>

</div>

<style>
    
    .hero-glass {
        max-width: 720px;
        margin: 4rem auto 0;
        padding: 3rem 2.5rem;
        background: var(--glass-bg);
        backdrop-filter: blur(18px) saturate(140%);
        -webkit-backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 255, 157, 0.06), inset 0 1px 0 rgba(255,255,255,0.03);
        position: relative;
        overflow: hidden;
    }

    .hero-glass::after {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(from 0deg, transparent, rgba(0,255,157,0.06), transparent 30%);
        animation: rotateGlow 8s linear infinite;
        pointer-events: none;
    }

    @keyframes rotateGlow {
        to { transform: rotate(360deg); }
    }

    /* fake terminal window dots */
    .terminal-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(0,0,0,0.35);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.75rem;
        position: relative;
        z-index: 2;
    }

    .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .terminal-path {
        margin-left: 6px;
        color: var(--neon-green);
        opacity: 0.8;
    }

    /* glitch title */
    .glitch-title {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 3.2rem;
        color: #eafff5;
        text-shadow: 0 0 10px rgba(0,255,157,0.6), 0 0 30px rgba(0,255,157,0.25);
        position: relative;
        margin: 1rem 0 0.5rem;
        z-index: 2;
    }

    .glitch-title::before,
    .glitch-title::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        overflow: hidden;
        z-index: -1;
    }

    .glitch-title::before {
        color: var(--neon-cyan);
        clip-path: inset(0 0 55% 0);
        animation: glitchTop 3.5s infinite linear;
    }

    .glitch-title::after {
        color: var(--neon-pink);
        clip-path: inset(55% 0 0 0);
        animation: glitchBottom 3.5s infinite linear;
    }

    @keyframes glitchTop {
        0%, 92%, 100% { transform: translate(0, 0); opacity: 0; }
        93% { transform: translate(-2px, -1px); opacity: 0.8; }
        95% { transform: translate(2px, 1px); opacity: 0.8; }
        97% { transform: translate(-1px, 0); opacity: 0; }
    }

    @keyframes glitchBottom {
        0%, 90%, 100% { transform: translate(0, 0); opacity: 0; }
        91% { transform: translate(2px, 1px); opacity: 0.8; }
        94% { transform: translate(-2px, -1px); opacity: 0.8; }
        96% { transform: translate(1px, 0); opacity: 0; }
    }

    .tagline {
        font-size: 1.1rem;
        color: #a9ffe6;
        letter-spacing: 0.5px;
        position: relative;
        z-index: 2;
    }

    .cursor {
        display: inline-block;
        color: var(--neon-green);
        animation: blink 1s step-end infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    .glow-btn {
        font-size: 1rem;
        padding: 0.7rem 1.8rem;
        position: relative;
        z-index: 2;
    }

    .status-row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.6rem;
        position: relative;
        z-index: 2;
    }

    .status-chip {
        font-size: 0.75rem;
        color: #a9ffe6;
        border: 1px solid var(--glass-border);
        background: rgba(0,0,0,0.25);
        border-radius: 20px;
        padding: 5px 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        letter-spacing: 0.5px;
    }

    .pulse-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--neon-green);
        box-shadow: 0 0 6px var(--neon-green);
        animation: pulseDot 1.6s ease-in-out infinite;
    }

    @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
    }

    @media (max-width: 576px) {
        .glitch-title { font-size: 2.2rem; }
        .hero-glass { padding: 2rem 1.2rem; margin-top: 2rem; }
    }

    

    
</style>

{% endblock %}
